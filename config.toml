# Between Heats settings. All tunable rules live here.

[llm]
# NVIDIA's free API (build.nvidia.com). OpenAI-compatible.
base_url = "https://integrate.api.nvidia.com/v1"
api_key_env = "NVIDIA_API_KEY"
max_tokens = 8192             # room for reasoning + a page pair's worth of questions
timeout_seconds = 90          # drop a stuck model sooner and use the backup

[models]
# The list order is the fallback order. The checker comes from a different company
# than the writer, so it is less likely to share the writer's mistakes.
writer  = ["nvidia/nemotron-3-ultra-550b-a55b", "nvidia/nemotron-3.5-super-vl-120b-a12b"]
# Kimi answered in ~20 s in testing; Mistral Large timed out, so it is the backup.
checker = ["moonshotai/kimi-k3.1-pro", "mistralai/mistral-large-4-1t-a52b"]

[generate.parallel]
workers = 5                   # page pairs processed at the same time

[generate]
pages_per_call = 2
questions_per_page = 3
quote_min_score = 85          # rapidfuzz partial_ratio, 0-100

[gaps]
timezone = "America/Halifax"
gap_keywords = ["bus"]                                 # timed events that ARE study gaps
meet_keywords = ["invitational", "classic", "meet"]    # all-day events that make a meet day
meet_day_start = "06:00"
sleep_start = "23:00"
sleep_end = "04:50"
min_gap_minutes = 15
max_sets_per_day = 6
set_minutes = 5

[study]
set_size = 5
boxes = 3
quiz_date = "2026-10-26"      # NURS 2100 Quiz 4 opens
weak_list_hour = 20           # 8 PM the night before the quiz

[replay]
seconds_per_set = 15          # Telegram /replay: 12 sets + weak list in about 3 minutes
